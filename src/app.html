<title>Trainingsplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column, stacked views, fixed tab bar at the bottom */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #141a24;
  --muted: #5b6677;
  --line: #d5dbe4;
  --accent: #1f4fe0;
  --accent-ink: #ffffff;
  --accent-soft: #dde6fd;
  --done: #13875a;
  --done-soft: #d6f0e4;
  --warn: #c2410c;
  --shadow: 0 1px 2px rgba(20, 26, 36, .06), 0 4px 16px rgba(20, 26, 36, .06);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --tabbar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1118; --surface: #171d27; --ink: #e8ecf2; --muted: #97a2b3; --line: #2a3240;
    --accent: #6d92ff; --accent-ink: #0b1020; --accent-soft: #1d2a4d;
    --done: #3cc98a; --done-soft: #133426; --warn: #fb8a5a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1118; --surface: #171d27; --ink: #e8ecf2; --muted: #97a2b3; --line: #2a3240;
  --accent: #6d92ff; --accent-ink: #0b1020; --accent-soft: #1d2a4d;
  --done: #3cc98a; --done-soft: #133426; --warn: #fb8a5a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
  display: flex; flex-direction: column; gap: 18px;
}
.view { display: flex; flex-direction: column; gap: 18px; }

/* Headings */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head > div { min-width: 0; }
.eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: 40px; line-height: 1; letter-spacing: .01em; text-transform: uppercase;
  text-wrap: balance; overflow-wrap: anywhere;
}
h2 {
  margin: 0; font-family: var(--font-display); font-weight: 600;
  font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--line); }
.btn.danger.armed { background: var(--warn); color: #fff; border-color: var(--warn); }
.btn.block { width: 100%; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 0; flex: none;
  background: transparent; color: var(--muted); display: grid; place-items: center;
}
.icon-btn svg { width: 22px; height: 22px; }
.back {
  display: inline-flex; align-items: center; gap: 2px; border: 0; background: none;
  color: var(--accent); font-weight: 600; padding: 4px 0; align-self: flex-start;
}
.back svg { width: 20px; height: 20px; }

/* Week list */
.week { display: flex; flex-direction: column; gap: 8px; }
.day-row {
  display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px;
  width: 100%; text-align: left; padding: 12px 14px 12px 10px;
  background: var(--surface); border: 1.5px solid transparent; border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.day-row.today { border-color: var(--accent); }
.day-row.rest { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); }
.day-abbr {
  font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1;
  text-align: center; text-transform: uppercase; color: var(--ink);
}
.day-row.rest .day-abbr { color: var(--muted); }
.day-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.day-title { font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-row.rest .day-title { color: var(--muted); font-weight: 500; }
.day-meta { font-size: 14px; color: var(--muted); }
.day-side { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.day-side svg { width: 18px; height: 18px; }
.pill {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
}
.pill.done { background: var(--done-soft); color: var(--done); }

/* Empty state */
.empty {
  display: flex; flex-direction: column; gap: 12px; padding: 20px;
  border: 1.5px dashed var(--line); border-radius: var(--radius);
}
.empty p { margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Day editor */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); font-size: 17px;
}
.input:focus { border-color: var(--accent); outline: none; }
.title-input {
  font-family: var(--font-display); font-weight: 700; font-size: 26px; text-transform: uppercase;
  letter-spacing: .01em;
}
.ex-list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.ex-item {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  padding: 14px 8px 14px 16px; border: 0; background: none; text-align: left; width: 100%;
}
.ex-item + .ex-item { border-top: 1px solid var(--line); }
.ex-name { font-weight: 600; font-size: 17px; }
.ex-detail { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-note { font-size: 14px; color: var(--muted); font-style: italic; }
.ex-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; border: 0; background: none; text-align: left; padding: 0; }
.set svg { width: 20px; height: 20px; }
.ex-actions { display: flex; }

/* Today / workout */
.progress-wrap { display: flex; flex-direction: column; gap: 8px; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.progress.full > span { background: var(--done); }
.progress-label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip {
  flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.work { display: flex; flex-direction: column; gap: 10px; }
.work-item {
  display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
}
.work-item.complete { background: var(--done-soft); box-shadow: none; }
.work-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.work-top > div { min-width: 0; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.set {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--surface); font-family: var(--font-display); font-weight: 700; font-size: 18px;
  color: var(--muted); display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.set.on { background: var(--done); border-color: var(--done); color: #fff; }
.check {
  display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0;
  font-weight: 600; color: var(--muted); align-self: flex-start;
}
.check .box {
  width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line);
  display: grid; place-items: center; background: var(--surface);
}
.check.on { color: var(--done); }
.check.on .box { background: var(--done); border-color: var(--done); color: #fff; }
.check .box svg { width: 18px; height: 18px; }
.banner {
  display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--radius);
  background: var(--done-soft); color: var(--done); font-weight: 600;
}
.banner svg { width: 24px; height: 24px; flex: none; }

/* History */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
}
.stat b {
  font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.chart { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px 10px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.log { display: flex; flex-direction: column; gap: 8px; }
.log-item {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 8px 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
}
.log-item > div { min-width: 0; }
.log-date { font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.log-title { font-weight: 600; font-size: 17px; }
.log-sum { font-size: 14px; color: var(--muted); }
.log-del.armed { color: var(--warn); }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 20, .55); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-width: 560px; margin: 0 auto; max-height: 92%; overflow-y: auto;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; min-height: 38px; border-radius: 8px; background: transparent; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.num { text-align: center; font-variant-numeric: tabular-nums; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-weight: 600; font-size: 15px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
.sync { font-size: 12px; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .progress > span { transition: none; }
}
</style>

<div class="app" id="app"></div>
<div class="tabbar"><nav id="tabs" aria-label="Bereiche"></nav></div>
<div id="overlay"></div>

<script>
(() => {
  "use strict";

  // ---------- constants ----------
  const DAYS = [
    { key: "mo", abbr: "Mo", name: "Montag" },
    { key: "di", abbr: "Di", name: "Dienstag" },
    { key: "mi", abbr: "Mi", name: "Mittwoch" },
    { key: "do", abbr: "Do", name: "Donnerstag" },
    { key: "fr", abbr: "Fr", name: "Freitag" },
    { key: "sa", abbr: "Sa", name: "Samstag" },
    { key: "so", abbr: "So", name: "Sonntag" },
  ];
  const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  const ICON = {
    week: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
    history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  };

  const SAMPLE_PLAN = {
    mo: { title: "Oberkörper", exercises: [
      { name: "Bankdrücken", kind: "kraft", sets: 3, reps: 8, weight: 60 },
      { name: "Langhantelrudern", kind: "kraft", sets: 3, reps: 10, weight: 50 },
      { name: "Schulterdrücken", kind: "kraft", sets: 3, reps: 10, weight: 30 },
      { name: "Klimmzüge", kind: "kraft", sets: 3, reps: 6, note: "Mit Band, falls nötig" },
    ] },
    di: { title: "", exercises: [] },
    mi: { title: "Lauftraining", exercises: [
      { name: "Lockerer Dauerlauf", kind: "ausdauer", minutes: 40, km: 7, note: "Puls unter 150" },
    ] },
    do: { title: "", exercises: [] },
    fr: { title: "Unterkörper", exercises: [
      { name: "Kniebeuge", kind: "kraft", sets: 4, reps: 6, weight: 80 },
      { name: "Rumänisches Kreuzheben", kind: "kraft", sets: 3, reps: 8, weight: 70 },
      { name: "Ausfallschritte", kind: "kraft", sets: 3, reps: 10, weight: 20 },
      { name: "Wadenheben", kind: "kraft", sets: 3, reps: 15 },
    ] },
    sa: { title: "Mobility", exercises: [
      { name: "Dehnen & Faszienrolle", kind: "ausdauer", minutes: 20 },
    ] },
    so: { title: "", exercises: [] },
  };

  // ---------- helpers ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const fmtNum = (n) => String(n).replace(".", ",");
  const parseNum = (v) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) && n > 0 ? n : null; };
  const pad = (n) => String(n).padStart(2, "0");
  const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayKeyOf = (d) => DAYS[(d.getDay() + 6) % 7].key;
  const dayByKey = (k) => DAYS.find((d) => d.key === k);
  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const n = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - n);
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return { week: Math.ceil(((d - y0) / 86400000 + 1) / 7), year: d.getUTCFullYear() };
  }
  function mondayOf(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d;
  }
  function fmtDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return `${DAYS[(dt.getDay() + 6) % 7].abbr}, ${d}. ${MONTHS[m - 1]} ${y}`;
  }
  function exDetail(ex) {
    if (ex.kind === "ausdauer") {
      const parts = [];
      if (ex.minutes) parts.push(`${fmtNum(ex.minutes)} min`);
      if (ex.km) parts.push(`${fmtNum(ex.km)} km`);
      return parts.join(" · ") || "Ausdauer";
    }
    let s = `${ex.sets || 1} × ${ex.reps || "–"}`;
    if (ex.weight) s += ` · ${fmtNum(ex.weight)} kg`;
    return s;
  }
  const totalUnits = (ex) => (ex.kind === "ausdauer" ? 1 : Math.max(1, ex.sets || 1));

  function emptyPlan() {
    const days = {};
    DAYS.forEach((d) => (days[d.key] = { title: "", exercises: [] }));
    return { days };
  }
  function normalizePlan(p) {
    const plan = emptyPlan();
    if (p && p.days) DAYS.forEach((d) => {
      const src = p.days[d.key];
      if (src) plan.days[d.key] = {
        title: String(src.title || ""),
        exercises: Array.isArray(src.exercises) ? src.exercises.map((e) => ({ ...e, id: e.id || uid() })) : [],
      };
    });
    return plan;
  }
  const isTrainingDay = (day) => !!(day && (day.title.trim() || day.exercises.length));
  const planIsEmpty = (plan) => DAYS.every((d) => !isTrainingDay(plan.days[d.key]));

  // ---------- storage ----------
  // On claude.ai: the per-person private area of the artifact database (synced across devices).
  // Standalone (home screen web app): localStorage on this device.
  const LS = {
    get(k) { try { const v = localStorage.getItem("tp." + k); return v ? JSON.parse(v) : null; } catch { return null; } },
    set(k, v) { try { localStorage.setItem("tp." + k, JSON.stringify(v)); } catch {} },
  };
  const Store = {
    mode: "local", db: null, uid: null, chains: {},
    async connect() {
      if (!window.claude || typeof window.claude.use !== "function") return false;
      try {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (!db || !id) return false;
        this.db = db; this.uid = id; this.mode = "cloud";
        return true;
      } catch { return false; }
    },
    ref(k) { return this.db.doc(`data/users/${this.uid}/${k}`); },
    async load(k) {
      if (this.mode !== "cloud") return LS.get(k);
      const snap = await this.ref(k).get();
      return snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
    },
    save(k, value) {
      LS.set(k, value);
      if (this.mode !== "cloud") return Promise.resolve();
      const run = async () => {
        try { await this.ref(k).set(value); state.syncError = false; }
        catch (e) {
          if (e && e.code === "unavailable") {
            await new Promise((r) => setTimeout(r, 800 + Math.random() * 800));
            try { await this.ref(k).set(value); state.syncError = false; return; } catch {}
          }
          state.syncError = true; toast("Speichern fehlgeschlagen. Deine Änderung ist nur auf diesem Gerät.");
        }
      };
      this.chains[k] = (this.chains[k] || Promise.resolve()).then(run);
      return this.chains[k];
    },
  };

  // ---------- state ----------
  const now = new Date();
  const state = {
    tab: ["woche", "heute", "verlauf"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "woche",
    editDay: null,
    todayKey: dayKeyOf(now),
    workoutDay: null,
    plan: normalizePlan(LS.get("plan")),
    log: (LS.get("log") && Array.isArray(LS.get("log").entries)) ? LS.get("log").entries : [],
    progress: LS.get("progress") || null,
    loaded: false,
    syncError: false,
  };

  let planTimer = null;
  function savePlan(immediate) {
    clearTimeout(planTimer);
    const go = () => Store.save("plan", { days: state.plan.days, updated: Date.now() });
    if (immediate) go(); else planTimer = setTimeout(go, 500);
  }
  const saveLog = () => Store.save("log", { entries: state.log });
  const saveProgress = () => LS.set("progress", state.progress);

  // ---------- rendering ----------
  const app = $("#app");
  const overlay = $("#overlay");

  function renderTabs() {
    const tabs = [["woche", "Woche", ICON.week], ["heute", "Heute", ICON.today], ["verlauf", "Verlauf", ICON.history]];
    $("#tabs").innerHTML = tabs.map(([k, label, ic]) =>
      `<button class="tab" data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ""}>${ic}<span>${label}</span></button>`).join("");
  }

  function render() {
    renderTabs();
    if (state.tab === "woche") app.innerHTML = state.editDay ? viewDay() : viewWeek();
    else if (state.tab === "heute") app.innerHTML = viewToday();
    else app.innerHTML = viewHistory();
  }

  function syncNote() {
    if (!state.loaded) return `<p class="sync">Lade deinen Plan …</p>`;
    return Store.mode === "cloud"
      ? `<p class="sync">In deinem Claude-Konto gespeichert${state.syncError ? " · letzte Änderung nicht synchronisiert" : ""}</p>`
      : `<p class="sync">Auf diesem Gerät gespeichert</p>`;
  }

  function viewWeek() {
    const { week, year } = isoWeek(now);
    const planned = DAYS.filter((d) => isTrainingDay(state.plan.days[d.key])).length;
    const doneToday = state.log.some((e) => e.date === isoDate(now) && e.day === state.todayKey);
    let body;
    if (planIsEmpty(state.plan) && state.loaded) {
      body = `<div class="empty">
        <p><strong>Noch kein Plan.</strong></p>
        <p class="muted">Tippe auf einen Wochentag, gib ihm einen Namen wie „Oberkörper“ oder „Laufen“ und füge Übungen mit Sätzen, Wiederholungen und Gewicht hinzu.</p>
        <div class="row"><button class="btn soft" data-act="sample">Beispielplan laden</button></div>
      </div>`;
    } else body = "";
    const rows = DAYS.map((d) => {
      const day = state.plan.days[d.key];
      const train = isTrainingDay(day);
      const isToday = d.key === state.todayKey;
      const kinds = new Set(day.exercises.map((e) => e.kind));
      const kindTxt = kinds.size === 2 ? "Kraft + Ausdauer" : kinds.has("ausdauer") ? "Ausdauer" : kinds.has("kraft") ? "Kraft" : "";
      const meta = train
        ? [day.exercises.length === 1 ? "1 Übung" : `${day.exercises.length} Übungen`, kindTxt].filter(Boolean).join(" · ")
        : "Tippen zum Planen";
      const pill = isToday ? (doneToday ? `<span class="pill done">Erledigt</span>` : `<span class="pill">Heute</span>`) : "";
      return `<button class="day-row ${train ? "" : "rest"} ${isToday ? "today" : ""}" data-day="${d.key}" aria-label="${d.name} bearbeiten">
        <span class="day-abbr">${d.abbr}</span>
        <span class="day-main"><span class="day-title">${train ? esc(day.title || "Training") : "Ruhetag"}</span><span class="day-meta">${meta}</span></span>
        <span class="day-side">${pill}${ICON.chev}</span>
      </button>`;
    }).join("");
    return `<section class="view">
      <div class="head"><div><div class="eyebrow">KW ${week} · ${year} · ${planned === 1 ? "1 Trainingstag" : `${planned} Trainingstage`}</div><h1>Trainingsplan</h1></div></div>
      ${body}
      <div class="week">${rows}</div>
      ${syncNote()}
    </section>`;
  }

  function viewDay() {
    const d = dayByKey(state.editDay);
    const day = state.plan.days[d.key];
    const list = day.exercises.length
      ? `<div class="ex-list">${day.exercises.map((ex, i) => `
          <div class="ex-item">
            <button class="ex-body" data-edit="${ex.id}">
              <span class="ex-name">${esc(ex.name)}</span>
              <span class="ex-detail">${esc(exDetail(ex))}</span>
              ${ex.note ? `<span class="ex-note">${esc(ex.note)}</span>` : ""}
            </button>
            <span class="ex-actions">
              ${i > 0 ? `<button class="icon-btn" data-up="${ex.id}" aria-label="${esc(ex.name)} nach oben">${ICON.up}</button>` : ""}
              <button class="icon-btn" data-edit="${ex.id}" aria-label="${esc(ex.name)} bearbeiten">${ICON.chev}</button>
            </span>
          </div>`).join("")}</div>`
      : `<div class="empty"><p class="muted">Keine Übungen. Ohne Übungen und Namen gilt ${d.name} als Ruhetag.</p></div>`;
    return `<section class="view">
      <button class="back" data-act="back">${ICON.back}Woche</button>
      <div class="head"><div><div class="eyebrow">${d.name}</div><h1>${esc(day.title) || (isTrainingDay(day) ? "Training" : "Ruhetag")}</h1></div></div>
      <div class="field"><label for="day-title">Name der Einheit</label>
        <input class="input title-input" id="day-title" value="${esc(day.title)}" placeholder="z. B. Oberkörper" maxlength="40" autocomplete="off"></div>
      <h2>Übungen</h2>
      ${list}
      <button class="btn block" data-act="add-ex">+ Übung hinzufügen</button>
      ${isTrainingDay(day) ? `<button class="btn danger block" data-act="clear-day">Zum Ruhetag machen</button>` : ""}
    </section>`;
  }

  // The day whose workout "Heute" shows: an explicit pick, else today's started workout, else today.
  function activeKey() {
    if (state.workoutDay) return state.workoutDay;
    const p = state.progress;
    return p && p.date === isoDate(new Date()) ? p.day : state.todayKey;
  }

  function currentProgress(key) {
    const date = isoDate(new Date());
    if (!state.progress || state.progress.date !== date || state.progress.day !== key) {
      state.progress = { date, day: key, done: {} };
    }
    return state.progress;
  }

  function viewToday() {
    const date = isoDate(new Date());
    const trainingDays = DAYS.filter((d) => isTrainingDay(state.plan.days[d.key]));
    const key = activeKey();
    const d = dayByKey(key);
    const day = state.plan.days[key];
    const chips = trainingDays.length > 1 || (trainingDays.length && !isTrainingDay(state.plan.days[state.todayKey]))
      ? `<div class="chips" role="group" aria-label="Einheit wählen">${trainingDays.map((t) =>
          `<button class="chip" data-pick="${t.key}" aria-pressed="${t.key === key}">${t.abbr} · ${esc(state.plan.days[t.key].title || "Training")}</button>`).join("")}</div>`
      : "";
    const head = `<div class="head"><div><div class="eyebrow">${fmtDate(date)}${key !== state.todayKey ? ` · Plan vom ${d.name}` : ""}</div>
      <h1>${isTrainingDay(day) ? esc(day.title || "Training") : "Ruhetag"}</h1></div></div>`;

    if (!isTrainingDay(day) || !day.exercises.length) {
      const msg = !trainingDays.length
        ? `<div class="empty"><p class="muted">Du hast noch keine Trainingstage geplant.</p><div class="row"><button class="btn soft" data-act="goto-week">Plan anlegen</button></div></div>`
        : isTrainingDay(day)
          ? `<div class="empty"><p class="muted">Für diese Einheit sind noch keine Übungen eingetragen.</p><div class="row"><button class="btn soft" data-day-edit="${key}">Übungen hinzufügen</button></div></div>`
          : `<div class="empty"><p class="muted">Heute ist Ruhetag. Wenn du trotzdem trainieren willst, wähle oben eine Einheit.</p></div>`;
      return `<section class="view">${head}${chips}${msg}</section>`;
    }

    const loggedToday = state.log.find((e) => e.date === date && e.day === key);
    const prog = currentProgress(key);
    let doneUnits = 0, allUnits = 0;
    const items = day.exercises.map((ex) => {
      const total = totalUnits(ex);
      const done = Math.min(prog.done[ex.id] || 0, total);
      doneUnits += done; allUnits += total;
      const complete = done >= total;
      const control = ex.kind === "ausdauer"
        ? `<button class="check ${complete ? "on" : ""}" data-toggle="${ex.id}" aria-pressed="${complete}"><span class="box">${complete ? ICON.check : ""}</span>${complete ? "Erledigt" : "Abhaken"}</button>`
        : `<div class="sets" role="group" aria-label="Sätze ${esc(ex.name)}">${Array.from({ length: total }, (_, i) =>
            `<button class="set ${i < done ? "on" : ""}" data-set="${ex.id}" data-i="${i}" aria-label="Satz ${i + 1}${i < done ? " erledigt" : ""}">${i < done ? ICON.check : i + 1}</button>`).join("")}</div>`;
      return `<div class="work-item ${complete ? "complete" : ""}">
        <div class="work-top"><div><div class="ex-name">${esc(ex.name)}</div>${ex.note ? `<div class="ex-note">${esc(ex.note)}</div>` : ""}</div>
          <div class="ex-detail">${esc(exDetail(ex))}</div></div>
        ${control}
      </div>`;
    }).join("");
    const pct = allUnits ? Math.round((doneUnits / allUnits) * 100) : 0;
    const banner = loggedToday
      ? `<div class="banner">${ICON.check}<span>Heute um ${new Date(loggedToday.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr abgeschlossen</span></div>`
      : "";
    return `<section class="view">
      ${head}${chips}${banner}
      <div class="progress-wrap">
        <div class="progress ${pct === 100 ? "full" : ""}"><span style="width:${pct}%"></span></div>
        <div class="progress-label"><span>${doneUnits} von ${allUnits} ${allUnits === 1 ? "Schritt" : "Schritten"}</span><span>${pct} %</span></div>
      </div>
      <div class="work">${items}</div>
      <button class="btn block" data-act="finish" ${doneUnits ? "" : "disabled"}>${loggedToday ? "Erneut speichern" : "Training abschließen"}</button>
      ${doneUnits ? `<button class="btn ghost block" data-act="reset">Häkchen zurücksetzen</button>` : ""}
    </section>`;
  }

  function viewHistory() {
    const today = new Date();
    const mon = mondayOf(today);
    const monIso = isoDate(mon);
    const thisWeek = state.log.filter((e) => e.date >= monIso).length;
    const planned = DAYS.filter((d) => isTrainingDay(state.plan.days[d.key])).length;
    // 8 weeks of counts, oldest first
    const weeks = [];
    for (let i = 7; i >= 0; i--) {
      const start = new Date(mon); start.setDate(start.getDate() - i * 7);
      const end = new Date(start); end.setDate(end.getDate() + 7);
      const s = isoDate(start), e = isoDate(end);
      weeks.push({ label: "KW " + isoWeek(start).week, n: state.log.filter((x) => x.date >= s && x.date < e).length, current: i === 0 });
    }
    // streak: consecutive weeks (ending this or last week) with at least one session
    let streak = 0;
    for (let i = weeks.length - 1; i >= 0; i--) {
      if (weeks[i].n > 0) streak++;
      else if (weeks[i].current) continue;
      else break;
    }
    const max = Math.max(planned, ...weeks.map((w) => w.n), 1);
    const W = 320, H = 130, top = 16, bottom = 22, left = 4, bw = 26;
    const gap = (W - left * 2 - bw * 8) / 7;
    const y = (v) => top + (H - top - bottom) * (1 - v / max);
    const bars = weeks.map((w, i) => {
      const x = left + i * (bw + gap);
      const h = Math.max(0, y(0) - y(w.n));
      return `<rect x="${x}" y="${y(w.n)}" width="${bw}" height="${h}" rx="4" fill="${w.current ? "var(--accent)" : "var(--accent-soft)"}"/>
        ${w.n ? `<text x="${x + bw / 2}" y="${y(w.n) - 4}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${w.n}</text>` : ""}
        <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${w.label.replace("KW ", "")}</text>`;
    }).join("");
    const goal = planned ? `<line x1="0" x2="${W}" y1="${y(planned)}" y2="${y(planned)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
      <text x="${W}" y="${y(planned) - 4}" text-anchor="end">Ziel ${planned}</text>` : "";
    const chart = `<div class="chart"><h2>Einheiten pro Kalenderwoche</h2>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trainingseinheiten der letzten 8 Wochen">
        <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>
        ${goal}${bars}
      </svg></div>`;
    const list = state.log.length
      ? `<div class="log">${state.log.slice(0, 60).map((e) => {
          const sum = e.items.filter((i) => i.done > 0).length;
          return `<div class="log-item"><div>
              <div class="log-date">${fmtDate(e.date)}</div>
              <div class="log-title">${esc(e.title)}</div>
              <div class="log-sum">${sum} von ${e.items.length} Übungen · ${e.items.map((i) => esc(i.name)).slice(0, 3).join(", ")}${e.items.length > 3 ? " …" : ""}</div>
            </div>
            <button class="icon-btn log-del" data-del="${e.id}" aria-label="Eintrag löschen">${ICON.trash}</button></div>`;
        }).join("")}</div>`
      : `<div class="empty"><p class="muted">Noch keine Einheiten. Hake unter „Heute“ deine Sätze ab und tippe auf „Training abschließen“. Dann erscheint das Training hier.</p></div>`;
    return `<section class="view">
      <div class="head"><div><div class="eyebrow">Fortschritt</div><h1>Verlauf</h1></div></div>
      <div class="stats">
        <div class="stat"><b>${thisWeek}${planned ? `<small class="muted" style="font-size:18px">/${planned}</small>` : ""}</b><span>Diese Woche</span></div>
        <div class="stat"><b>${streak}</b><span>${streak === 1 ? "Woche" : "Wochen"} am Stück</span></div>
        <div class="stat"><b>${state.log.length}</b><span>Gesamt</span></div>
      </div>
      ${chart}
      <h2>Letzte Einheiten</h2>
      ${list}
    </section>`;
  }

  // ---------- exercise sheet ----------
  let sheet = null; // { dayKey, id|null, kind }
  function openSheet(dayKey, id) {
    const ex = id ? state.plan.days[dayKey].exercises.find((e) => e.id === id) : null;
    sheet = { dayKey, id: ex ? ex.id : null, kind: ex ? ex.kind : "kraft" };
    const v = (k) => (ex && ex[k] != null ? fmtNum(ex[k]) : "");
    overlay.innerHTML = `<div class="scrim" data-act="close-sheet"></div>
      <form class="sheet" id="ex-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
        <div class="grabber"></div>
        <div class="sheet-head"><h3 id="sheet-title">${ex ? "Übung bearbeiten" : "Neue Übung"}</h3>
          <button type="button" class="icon-btn" data-act="close-sheet" aria-label="Schließen">${ICON.close}</button></div>
        <div class="field"><label for="ex-name">Übung</label>
          <input class="input" id="ex-name" value="${esc(ex ? ex.name : "")}" placeholder="z. B. Kniebeuge" maxlength="50" autocomplete="off" required></div>
        <div class="seg" role="group" aria-label="Art">
          <button type="button" data-kind="kraft" aria-pressed="${sheet.kind === "kraft"}">Kraft</button>
          <button type="button" data-kind="ausdauer" aria-pressed="${sheet.kind === "ausdauer"}">Ausdauer</button>
        </div>
        <div class="grid3" id="kraft-fields" ${sheet.kind === "kraft" ? "" : "hidden"}>
          <div class="field"><label for="ex-sets">Sätze</label><input class="input num" id="ex-sets" inputmode="numeric" value="${v("sets") || (ex ? "" : "3")}"></div>
          <div class="field"><label for="ex-reps">Wdh.</label><input class="input num" id="ex-reps" inputmode="numeric" value="${v("reps") || (ex ? "" : "10")}"></div>
          <div class="field"><label for="ex-weight">Gewicht kg</label><input class="input num" id="ex-weight" inputmode="decimal" value="${v("weight")}" placeholder="–"></div>
        </div>
        <div class="grid2" id="ausdauer-fields" ${sheet.kind === "ausdauer" ? "" : "hidden"}>
          <div class="field"><label for="ex-min">Dauer (min)</label><input class="input num" id="ex-min" inputmode="decimal" value="${v("minutes")}" placeholder="30"></div>
          <div class="field"><label for="ex-km">Distanz (km)</label><input class="input num" id="ex-km" inputmode="decimal" value="${v("km")}" placeholder="optional"></div>
        </div>
        <div class="field"><label for="ex-note">Notiz</label>
          <input class="input" id="ex-note" value="${esc(ex ? ex.note || "" : "")}" placeholder="optional, z. B. Pause 90 s" maxlength="80" autocomplete="off"></div>
        <p class="small" id="ex-error" style="color:var(--warn);margin:0" hidden>Gib der Übung einen Namen.</p>
        <div class="sheet-actions">
          ${ex ? `<button type="button" class="btn danger" data-act="del-ex">Löschen</button>` : ""}
          <button type="submit" class="btn">Speichern</button>
        </div>
      </form>`;
    if (!ex) setTimeout(() => $("#ex-name")?.focus(), 50);
  }
  function closeSheet() { sheet = null; overlay.innerHTML = ""; }

  function submitSheet() {
    const name = $("#ex-name").value.trim();
    if (!name) { $("#ex-error").hidden = false; $("#ex-name").focus(); return; }
    const ex = { id: sheet.id || uid(), name, kind: sheet.kind };
    if (sheet.kind === "kraft") {
      ex.sets = Math.min(12, Math.round(parseNum($("#ex-sets").value) || 1));
      const reps = $("#ex-reps").value.trim();
      ex.reps = reps ? reps.slice(0, 12) : "";
      const w = parseNum($("#ex-weight").value); if (w) ex.weight = w;
    } else {
      const m = parseNum($("#ex-min").value); if (m) ex.minutes = m;
      const k = parseNum($("#ex-km").value); if (k) ex.km = k;
    }
    const note = $("#ex-note").value.trim(); if (note) ex.note = note;
    const list = state.plan.days[sheet.dayKey].exercises;
    const idx = list.findIndex((e) => e.id === ex.id);
    if (idx >= 0) list[idx] = ex; else list.push(ex);
    savePlan(true);
    closeSheet(); render();
    toast(idx >= 0 ? "Übung gespeichert" : "Übung hinzugefügt");
  }

  // ---------- two-step confirm ----------
  let armed = null;
  function arm(el, label) {
    if (armed && armed.el === el) { clearTimeout(armed.t); armed = null; return true; }
    if (armed) disarm();
    armed = { el, prev: el.innerHTML, t: setTimeout(disarm, 3500) };
    el.classList.add("armed");
    if (label) el.textContent = label;
    return false;
  }
  function disarm() {
    if (!armed) return;
    clearTimeout(armed.t);
    if (armed.el.isConnected) { armed.el.classList.remove("armed"); armed.el.innerHTML = armed.prev; }
    armed = null;
  }

  let toastTimer = null;
  function toast(msg) {
    let el = $(".toast");
    if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2200);
  }

  function setTab(tab) {
    state.tab = tab; state.editDay = null;
    try { history.replaceState(null, "", "#" + tab); } catch {}
    render(); window.scrollTo(0, 0);
  }

  // ---------- events ----------
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button, .scrim");
    if (!t) return;
    const ds = t.dataset;

    if (ds.tab) return setTab(ds.tab);
    if (ds.day) { state.editDay = ds.day; render(); window.scrollTo(0, 0); return; }
    if (ds.dayEdit) { state.tab = "woche"; state.editDay = ds.dayEdit; render(); return; }
    if (ds.edit) return openSheet(state.editDay, ds.edit);
    if (ds.up) {
      const list = state.plan.days[state.editDay].exercises;
      const i = list.findIndex((e) => e.id === ds.up);
      if (i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; savePlan(); render(); }
      return;
    }
    if (ds.kind && sheet) {
      sheet.kind = ds.kind;
      overlay.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.kind === sheet.kind)));
      $("#kraft-fields").hidden = sheet.kind !== "kraft";
      $("#ausdauer-fields").hidden = sheet.kind !== "ausdauer";
      return;
    }
    if (ds.pick) { state.workoutDay = ds.pick; render(); return; }
    if (ds.set) {
      const p = currentProgress(activeKey());
      const i = Number(ds.i);
      const cur = p.done[ds.set] || 0;
      p.done[ds.set] = cur === i + 1 ? i : i + 1; // tap last filled set to undo it
      saveProgress(); render(); return;
    }
    if (ds.toggle) {
      const p = currentProgress(activeKey());
      p.done[ds.toggle] = p.done[ds.toggle] ? 0 : 1;
      saveProgress(); render(); return;
    }
    if (ds.del) {
      if (!arm(t)) return;
      state.log = state.log.filter((e) => e.id !== ds.del);
      saveLog(); render(); toast("Eintrag gelöscht"); return;
    }

    switch (ds.act) {
      case "back": state.editDay = null; render(); break;
      case "goto-week": setTab("woche"); break;
      case "sample":
        state.plan = normalizePlan({ days: SAMPLE_PLAN });
        savePlan(true); render(); toast("Beispielplan geladen. Passe ihn einfach an."); break;
      case "add-ex": openSheet(state.editDay, null); break;
      case "close-sheet": closeSheet(); break;
      case "del-ex":
        if (!arm(t, "Wirklich löschen?")) return;
        state.plan.days[sheet.dayKey].exercises = state.plan.days[sheet.dayKey].exercises.filter((e) => e.id !== sheet.id);
        savePlan(true); closeSheet(); render(); toast("Übung gelöscht"); break;
      case "clear-day":
        if (!arm(t, "Titel und alle Übungen löschen?")) return;
        state.plan.days[state.editDay] = { title: "", exercises: [] };
        savePlan(true); render(); break;
      case "reset":
        if (state.progress) { state.progress.done = {}; saveProgress(); }
        render(); break;
      case "finish": {
        const date = isoDate(new Date());
        const p = state.progress;
        if (!p) break;
        const day = state.plan.days[p.day];
        const entry = {
          id: uid(), date, ts: Date.now(), day: p.day, title: day.title || "Training",
          items: day.exercises.map((ex) => ({ name: ex.name, detail: exDetail(ex), done: Math.min(p.done[ex.id] || 0, totalUnits(ex)), total: totalUnits(ex) })),
        };
        state.log = state.log.filter((e) => !(e.date === date && e.day === p.day));
        state.log.unshift(entry);
        state.log = state.log.slice(0, 500);
        saveLog(); render(); toast("Training gespeichert");
        break;
      }
    }
  });

  document.addEventListener("submit", (ev) => {
    if (ev.target.id === "ex-form") { ev.preventDefault(); submitSheet(); }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "day-title" && state.editDay) {
      state.plan.days[state.editDay].title = ev.target.value;
      const h = $("h1"); if (h) h.textContent = ev.target.value || "Training";
      savePlan();
    }
    if (ev.target.id === "ex-name") $("#ex-error").hidden = true;
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && sheet) closeSheet(); });
  // Flush a pending plan save when the app goes to the background.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && planTimer) savePlan(true);
    if (document.visibilityState === "visible") {
      const k = dayKeyOf(new Date());
      if (k !== state.todayKey) { state.todayKey = k; state.workoutDay = null; render(); }
    }
  });

  // ---------- boot ----------
  render();
  (async () => {
    const cloud = await Store.connect();
    if (cloud) {
      try {
        const [plan, log] = await Promise.all([Store.load("plan"), Store.load("log")]);
        if (plan) state.plan = normalizePlan(plan);
        else if (!planIsEmpty(state.plan)) savePlan(true); // push a cached plan up
        if (log && Array.isArray(log.entries)) state.log = log.entries;
        else if (state.log.length) saveLog();
        LS.set("plan", { days: state.plan.days });
        LS.set("log", { entries: state.log });
      } catch {
        Store.mode = "local";
      }
    }
    state.loaded = true;
    render();
  })();
})();
</script>
